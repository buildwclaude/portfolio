<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="theme-color" content="#F3F1E9" />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/public-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      /* Entrances start from a hidden state, but only ever for a browser that
         is actually running this script: the class is added here rather than
         written into the markup, so no JavaScript means no hidden content.
         It is applied before first paint, and taken back off if the main
         bundle never arrives. */
      ;(function () {
        var root = document.documentElement;
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        } catch (error) {
          return;
        }
        root.classList.add('pre-reveal');
        setTimeout(function () {
          if (!('booted' in root.dataset)) root.classList.remove('pre-reveal');
        }, 2500);
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--page-->
  </body>
</html>
